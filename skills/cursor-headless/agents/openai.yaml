interface:
  display_name: "Cursor Headless"
  short_description: "MCP cursor_ask/plan/implement + cursor_cloud_plan/review/implement"
  default_prompt: "Local cursor_ask/plan: Grok 4.5 low/medium/high (+ Fast optional). Local cursor_implement: composer-2.5 default; escalate Grok by complexity. Cloud VM: cursor_cloud_* with repo_url + CURSOR_API_KEY; cursor_cloud_review delivery=pr_review posts GitHub PR review via host gh (needs pr_url). Cloud agents default to a new session each call — resume with agent_id or continue_session only for the same unfinished implement job; fresh reviews get a new agent. Parent sets timeout (default 1200s); on timeout treat as no result."
